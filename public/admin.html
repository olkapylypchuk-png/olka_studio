<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Olka</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--gold:#d4af37;--text:#eee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
.login{max-width:320px;margin:20vh auto;padding:24px;background:#111;border-radius:16px;text-align:center}
input,button,select{width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;border-radius:10px;color:#eee}
button{background:var(--gold);color:#000;font-weight:700;border:0;cursor:pointer}
header{display:flex;gap:8px;padding:12px;background:#111;border-bottom:1px solid #222;position:sticky;top:0}
header button{flex:1;background:#222;color:#eee} header button.active{background:var(--gold);color:#000}
.container{max-width:1000px;margin:0 auto;padding:16px}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:14px;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:8px;border-bottom:1px solid #222;text-align:left}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} @media(max-width:800px){.grid{grid-template-columns:1fr}}
img.prev{width:100%;height:140px;object-fit:cover;border-radius:10px;background:#000}
</style>
</head>
<body>
<div id="login" class="login">
  <h2 style="color:var(--gold)">Olka Admin</h2>
  <input id="pwd" type="password" placeholder="Пароль">
  <button onclick="login()">Увійти</button>
</div>

<div id="app" style="display:none">
<header>
  <button id="tab-dash" class="active" onclick="show('dash')">Dashboard</button>
  <button id="tab-book" onclick="show('book')">Bookings</button>
  <button id="tab-serv" onclick="show('serv')">Services</button>
</header>
<div class="container">
  <div id="dash"></div>
  <div id="book" style="display:none"></div>
  <div id="serv" style="display:none"></div>
</div>
</div>

<script>
let token = localStorage.getItem('olka_token')||'';
if(token) init(); else login.style.display='block';

async function login(){
  const p = pwd.value || token;
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
  if(r.ok){ const d=await r.json(); token=d.token; localStorage.setItem('olka_token',token); init(); }
  else alert('Невірний пароль');
}
function init(){ login.style.display='none'; app.style.display='block'; loadDash(); }

function show(t){
  ['dash','book','serv'].forEach(x=>{document.getElementById(x).style.display=x===t?'block':'none';document.getElementById('tab-'+x).classList.toggle('active',x===t)});
  if(t==='book') loadBookings(); if(t==='serv') loadServices();
}
async function api(p){ return fetch(p,{headers:{'x-admin-token':token}}).then(r=>r.json()); }

async function loadDash(){
  const s = await api('/api/admin/stats');
  dash.innerHTML = `<div class="grid">
    <div class="card"><h3>Всього бронювань</h3><div style="font-size:32px;color:var(--gold)">${s.total}</div></div>
    <div class="card"><h3>Цього місяця</h3><div style="font-size:32px;color:var(--gold)">${s.month}</div></div>
    <div class="card"><h3>Активних послуг</h3><div style="font-size:32px;color:var(--gold)">${s.services}</div></div>
  </div>`;
}
async function loadBookings(){
  const b = await api('/api/admin/bookings');
  book.innerHTML = `<div class="card"><table><tr><th>Дата</th><th>Час</th><th>Клієнт</th><th>Послуга</th><th>Тел</th></tr>${
    b.map(x=>`<tr><td>${x.date}</td><td>${x.time}</td><td>${x.client_name}</td><td>${x.service_name}</td><td>${x.phone}</td></tr>`).join('')
  }</table></div>`;
}
async function loadServices(){
  const s = await api('/api/admin/services');
  serv.innerHTML = `<div class="grid">${s.map(x=>`
    <div class="card">
      <img class="prev" src="${x.image||'/images/placeholder.jpg'}" id="img-${x.id}">
      <div style="margin:8px 0;font-weight:600">${x.name} — $${x.price}</div>
      <input type="file" id="f-${x.id}" accept="image/*">
      <button onclick="upload(${x.id})">Обрати файл → Завантажити</button>
    </div>`).join('')}</div>`;
}
async function upload(id){
  const f = document.getElementById('f-'+id).files[0]; if(!f) return alert('Обери файл');
  const fd = new FormData(); fd.append('photo', f);
  const r = await fetch('/api/admin/upload',{method:'POST',headers:{'x-admin-token':token},body:fd});
  const d = await r.json(); if(!d.ok) return alert('Помилка');
  await fetch('/api/admin/service-image',{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({id,image:d.path})});
  document.getElementById('img-'+id).src = d.path; alert('Збережено');
}
</script>
</body>
</html>
