<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olka Studio Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#181818;--border:rgba(255,255,255,0.08);
  --gold:#c9a96e;--gold-light:#e8d5b0;--text:#f0ece4;--muted:rgba(240,236,228,0.5);
  --green:#4ade80;--red:#ef4444;--yellow:#facc15;--radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:20px;font-size:15px}
.container{max-width:1200px;margin:0 auto}
h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;color:var(--gold);margin-bottom:6px}
.subtitle{color:var(--muted);font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:30px}

/* LOGIN */
.login-box{max-width:380px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px}
.login-box h1{text-align:center;margin-bottom:20px}
.login-box input{width:100%;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;font-family:inherit;margin-bottom:14px}
.login-box input:focus{outline:none;border-color:var(--gold)}
.login-box button{width:100%;padding:14px;background:var(--gold);color:#000;border:none;border-radius:10px;font-weight:500;font-size:15px;cursor:pointer;font-family:inherit}
.login-box button:hover{background:var(--gold-light)}
.error{color:var(--red);font-size:13px;margin-top:10px;text-align:center}

/* DASHBOARD */
.dashboard{display:none}
.dashboard.active{display:block}

/* TABS */
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:12px 18px;background:transparent;color:var(--muted);border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all 0.2s}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab:hover{color:var(--text)}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:30px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.stat-label{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--gold);font-weight:500}

/* SECTION */
.section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px}
.section h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--gold);margin-bottom:16px}

/* FILTER */
.filter-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{padding:8px 14px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}
.filter-btn.active{background:var(--gold);color:#000;border-color:var(--gold)}

/* BOOKING CARD */
.booking{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:10px}
.booking-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.booking-name{font-size:16px;font-weight:500}
.booking-name .gift{color:var(--gold);font-size:12px;margin-left:6px}
.booking-meta{display:flex;gap:12px;color:var(--muted);font-size:13px;flex-wrap:wrap;margin-bottom:8px}
.booking-services{font-size:13px;color:var(--text);margin-bottom:8px}
.booking-services li{margin-left:18px;color:var(--muted)}
.booking-info{font-size:13px;color:var(--muted);margin-bottom:10px}
.booking-info a{color:var(--gold);text-decoration:none}
.status{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px}
.status.pending{background:rgba(250,204,21,0.15);color:var(--yellow)}
.status.confirmed{background:rgba(74,222,128,0.15);color:var(--green)}
.status.cancelled{background:rgba(239,68,68,0.15);color:var(--red)}
.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{padding:8px 14px;border:none;border-radius:8px;font-family:inherit;font-size:13px;cursor:pointer;font-weight:500}
.btn-confirm{background:var(--green);color:#000}
.btn-cancel{background:var(--red);color:#fff}
.btn-delete{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.btn-gold{background:var(--gold);color:#000}
.btn:hover{opacity:0.85}

/* FORMS */
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-row input,.form-row select{flex:1;min-width:150px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px}
.form-row input:focus,.form-row select:focus{outline:none;border-color:var(--gold)}

/* GALLERY */
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gallery-item{background:var(--surface2);border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative}
.gallery-item img{width:100%;height:140px;object-fit:cover;display:block}
.gallery-item .del{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.7);color:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px}

/* BLOCKED */
.blocked-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.blocked-info{font-size:14px}
.blocked-info small{color:var(--muted);margin-left:8px}

.empty{text-align:center;color:var(--muted);padding:30px;font-style:italic}
.loading{text-align:center;color:var(--muted);padding:20px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--gold);color:#000;padding:14px 20px;border-radius:10px;font-weight:500;z-index:1000;animation:slide 0.3s}
@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(0)}}

.logout{position:absolute;top:20px;right:20px;background:transparent;color:var(--muted);border:1px solid var(--border);padding:8px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}
.logout:hover{color:var(--red)}

@media (max-width:600px){
  body{padding:12px;font-size:14px}
  h1{font-size:26px}
  .stat-value{font-size:26px}
  .booking-head{flex-direction:column}
}
</style>
</head>

  <input type="password" id="password" placeholder="Пароль" autofocus>
  <button onclick="login()">Увійти</button>
  <div id="log
