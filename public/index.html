<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Olka Studio — Hamilton</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--gold:#d4af37;--text:#eee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
header{padding:28px 16px;text-align:center;border-bottom:1px solid #222}
h1{margin:0;color:var(--gold);font-size:28px;letter-spacing:.5px}
p.sub{opacity:.7;margin:6px 0 0}
.container{max-width:820px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:680px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid #222;border-radius:18px;overflow:hidden}
.card img{width:100%;height:200px;object-fit:cover;background:#000}
.body{padding:12px}
.name{font-weight:600}
.price{color:var(--gold);margin-top:4px}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:12px;background:var(--gold);color:#000;font-weight:700;cursor:pointer}
dialog{border:0;border-radius:16px;background:#111;color:#eee;padding:0;max-width:420px;width:92%}
form{padding:18px}
input,textarea{width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;border-radius:10px;color:#eee}
footer{opacity:.5;text-align:center;padding:30px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>OLKA STUDIO</h1>
  <p class="sub">Nail & Beauty • Hamilton, ON</p>
</header>
<div class="container">
  <div id="services" class="grid"></div>
</div>

<dialog id="bookDlg">
  <form method="dialog" id="bookForm">
    <h3 style="margin:0 0 10px;color:var(--gold)" id="svcName"></h3>
    <input required name="name" placeholder="Ім'я">
    <input required name="phone" placeholder="Телефон">
    <input required name="date" type="date">
    <input required name="time" type="time">
    <textarea name="notes" placeholder="Коментар (необов'язково)"></textarea>
    <button class="btn" type="submit">Записатись</button>
    <button type="button" onclick="bookDlg.close()" style="background:#222;color:#eee" class="btn">Скасувати</button>
  </form>
</dialog>

<footer>© olka.hamiltondeals.ca</footer>

<script>
let currentService = null;
async function load(){
  const r = await fetch('/api/services'); const data = await r.json();
  document.getElementById('services').innerHTML = data.map(s=>`
    <div class="card">
      <img src="${s.image}" alt="">
      <div class="body">
        <div class="name">${s.name}</div>
        <div class="price">$${s.price} • ${s.duration} хв</div>
        <button class="btn" onclick='openBook(${JSON.stringify(s)})'>Записатись</button>
      </div>
    </div>`).join('');
}
function openBook(s){ currentService=s; svcName.textContent=s.name; bookDlg.showModal(); }
bookForm.onsubmit = async e=>{
  e.preventDefault();
  const fd = new FormData(bookForm);
  const body = Object.fromEntries(fd.entries());
  body.service_id = currentService.id;
  const r = await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.ok){ alert('Записано! Оля скоро напише.'); bookDlg.close(); bookForm.reset(); }
  else alert('Помилка');
};
load();
</script>
</body>
</html>
